# selene standard library for this Neovim config.
# `vim` / `jit` are declared permissive (a full vim API std lib goes stale
# fast; luacheck's .luacheckrc already carries the real neovim globals list).
# The rest are the Plenary/Busted test globals used in test/unit/*.
base: lua51

globals:
  vim:
    any: true
  jit:
    any: true
  Snacks:
    any: true
  io.stderr:
    any: true
  describe:
    any: true
  it:
    any: true
  before_each:
    any: true
  after_each:
    any: true
  pending:
    any: true
  assert:
    any: true
