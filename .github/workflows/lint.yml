---
name: Lua Lint, Format, and Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks neovim ripgrep
          sudo luarocks install luacheck
          curl -sSLo stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          sudo unzip -o stylua.zip -d /usr/local/bin

      - name: Run lint checks
        run: ./test/lint.sh

      - name: Run smoke + unit tests
        run: ./test/run.sh
