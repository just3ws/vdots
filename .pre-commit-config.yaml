---
# .pre-commit-config.yaml
# Simple local pre-commit setup — no external repos

repos:
  - repo: local
    hooks:
      - id: trim-trailing-whitespace
        name: Trim trailing whitespace
        entry: bash -c 'sed -i "" -E "s/[[:space:]]+$//" "$@"' --
        language: system
        types: [text]

      - id: eof-newline
        name: Ensure newline at end of file
        entry: >
          bash -c '
          for f in "$@"; do
            if [ -f "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo >> "$f"
              echo "Fixed missing newline in $f"
            fi
          done
          ' --
        language: system
        types: [text]

      - id: lua-syntax-check
        name: Lua syntax check
        entry: >
          bash -c '
          for f in "$@"; do
            luac -p "$f" || exit 1
          done
          ' --
        language: system
        files: \.lua$

      - id: vim-syntax-check
        name: Vimscript syntax check
        entry: >
          bash -c '
          for f in "$@"; do
            nvim --headless +"silent! source $f" +q || exit 1
          done
          ' --
        language: system
        files: \.(vim|vimrc)$

      - id: stylua-check
        name: Stylua format check
        entry: stylua --check .
        language: system
        files: \.lua$
        pass_filenames: false

      - id: luacheck
        name: Luacheck lint
        entry: luacheck . --no-cache --config .luacheckrc
        language: system
        files: \.lua$
        pass_filenames: false

      - id: smoke-tests
        name: Smoke + unit tests
        entry: ./test/run.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
