project_name: "vdots"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Experimental", "Done"]
labels: ["agent-reported", "bug", "question", "request", "needs-info", "agent-ready", "experimental", "do-not-implement"]
definition_of_done:
  - "All acceptance criteria checked with evidence (command output, file path, or test result)"
  - "nvim --headless -c 'qa!' passes with output captured in task notes or commit message"
  - "All related changes committed — git status clean for files touched by this task"
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "/opt/homebrew/bin/nvim"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "VD"
